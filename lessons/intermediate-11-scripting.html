{text:"Finds services that are stopped but set to start automatically.", hint:"A plain-English description of what the script does."}

distractor: {

concepts: [

prefill: "",
chips: [

{text:"Check-Services.ps1", hint:"Without the .\\ prefix, PowerShell won't run a script from the current folder by name alone, a deliberate safety measure."}
],

],

],
distractor: {

better: "Better fit for: never for a script in your current folder, always use .\\ explicitly."

concepts: [

],

],
hint: "Get-ExecutionPolicy, the same cmdlet from chapter 4, confirms exactly what's blocking the script before deciding what to do about it.",
tokens: [

],

notice: [

],
distractor: {

why: "Works, but skips confirming the actual current state first. On some machines, changing the policy also needs administrator rights you may not have realized you'd need until the command failed.",
better: "Better fit for: once you've already confirmed the current policy and know exactly what change is needed."
},
concepts: [
{term: "Restricted execution policy", explain: "The default on many Windows machines: no scripts run at all, only interactive commands. This is exactly why a saved .ps1 file can fail even though typing the same commands directly at the prompt works fine."}
]
},
{

},
concepts: [
{term: "RemoteSigned", explain: "A common, safer execution policy: scripts written locally run without restriction, but anything downloaded from the internet needs a trusted digital signature first. A practical middle ground between Restricted and Unrestricted."}
]
