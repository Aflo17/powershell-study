{text:"Get-Help", hint:"Looks up documentation for the cmdlet's parameters, not the shape of the objects it returns."}

tokens: [

],

],

concepts: [
{term: "Get-Member", explain: "The single most useful discovery cmdlet for output you don't recognize. Pipe anything into it and see exactly what properties and methods are available, instead of guessing."},
{term: "Properties vs methods", explain: "A property holds a value, like CPU or Name. A method is an action the object can perform, like Kill(). Get-Member's MemberType column tells you which is which."}
]
},
{

task: "Now sort by CPU time, highest first.",
prefill: "",

{text:"Sort-Object", cat:"cmdlet", note:"Reorders the objects flowing through the pipeline by a chosen property."},
{text:"CPU", cat:"value", note:"The property being sorted on, confirmed real back in step 1's Get-Member output."},
{text:"-Descending", cat:"param", note:"Flips the default ascending order to highest-value-first."}
],

notice: [

distractor: {

]
},
{

prefill: "",

{text:"Name, CPU", hint:"The two properties to keep."},
{text:"Format-Table", hint:"Changes how something displays. Doesn't actually remove properties from the underlying object."}
],
check: function(c){ return /sort-object/i.test(c) && /-descending/i.test(c) && /select-object/i.test(c) && /name/i.test(c) && /cpu/i.test(c); },

],
hint: "Keep the sort from step 2, and pipe into Select-Object Name, CPU to actually trim the object down to just those two properties.",
tokens: [
{text:"Sort-Object", cat:"cmdlet", note:"Carried over from step 2, still sorting before narrowing."},
{text:"-Descending", cat:"param", note:"Same as step 2."},
{text:"Select-Object", cat:"cmdlet", note:"Actually reduces the object to just the listed properties, not merely changing how it displays."},
{text:"Name, CPU", cat:"value", note:"The two properties being kept, everything else on the object is dropped."}
],
output: "Name                   CPU\n----                   ---\nchrome                 812.55\nnotepad                0.14\nsvchost                0.02",
order: "This comes after sorting because Select-Object trims the object down, and once properties are gone, you can't sort on them anymore. Sort first, narrow second, same rule as formatting.",
notice: [
{field:"Same two columns as Format-Table would show", note:"Looks identical on screen to the distractor's output, the real difference only shows up if you pipe this further into something else."}
],
distractor: {
name: "Format-Table Name, CPU",
why: "Format-Table changes what's displayed on screen, it doesn't touch the actual object. Every original property, Id, WS, every method, is still there underneath, just hidden from view. Pipe it further and that becomes a problem.",
better: "Better fit for: the very last step before printing something to the screen, never in the middle of a pipeline you're still building on."
},
concepts: [
{term: "Select-Object vs Format-Table", explain: "Select-Object actually reshapes the object, keeping only the properties you name. Format-Table just changes the display. They can look identical printed to the screen, and behave completely differently if you pipe the result anywhere else."}
]
},
{
title: "Step 4 of 4 - prove it's still real data",
task: "Confirm the result is still a real, usable object and not just formatted text.",
prefill: "",
chips: [
{text:"Get-Member", hint:"The same discovery tool from step 1, now checking the final result instead of the raw Get-Process output."}
],
check: function(c){ return /select-object/i.test(c) && /get-member/i.test(c); },
misses: [],
hint: "Pipe the whole thing, sort, select, and all, into Get-Member one more time to confirm what actually came out the other end.",
tokens: [
{text:"Get-Member", cat:"cmdlet", note:"Same discovery cmdlet from step 1, now confirming the final shape of the trimmed, sorted result."}
],
output: "   TypeName: Selected.System.Diagnostics.Process\n\nName    MemberType   Definition\n----    ----------   ----------\nCPU     NoteProperty double CPU=812.55\nName    NoteProperty string Name=chrome",
order: "This is last on purpose, it closes the loop back to step 1. You started by discovering what an object offers, and you end by confirming what you built is still a real object, just a smaller one, not plain formatted text that happens to look right.",
notice: [
{field:"Selected.System.Diagnostics.Process", note:"Notice the type name changed slightly, Select-Object created a new, trimmed object type, still a real object, just with only the two properties you kept."},
{field:"NoteProperty", note:"A different member type than the original Property from step 1, this is how Select-Object marks properties it explicitly copied over."}
],
distractor: {
name: "Trusting it just because it looks right",
why: "Formatted output and real trimmed objects can print identically to the screen. The only way to actually tell the difference, and confirm nothing downstream will break, is to check with Get-Member.",
better: "Better fit for: never, really. This is the one habit chapter 8 keeps coming back to: verify, don't assume."
},
concepts: [
{term: "Trust but verify objects", explain: "Two very different things, a real trimmed object and formatted display text, can look identical printed to a screen. Get-Member is how you tell them apart with certainty instead of guessing from appearances."}
]
}
]
